apiVersion: v1
kind: Service
metadata:
  name: judge0-service

spec:
  type: NodePort

  selector:
    app: srv-judge0

  ports:
    - name: http
      protocol: TCP
      port: 2358
      targetPort: 2358
      nodePort: 30000

---

apiVersion: v1
kind: Service
metadata:
  name: redis

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
      kind: Service
metadata:
  name: redis
spec:
  ports:
    - port: 6379
  selector:
    app: redis

---

apiVersion: v1
kind: Service
metadata:
  name: db

spec:
  type: ClusterIP

  selector:
    app: db

  ports:
    - name: postgres
      port: 5432
      targetPort: 5432