apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv-primary

spec:
  capacity:
    storage: 10Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  local:
    path: /var/lib/judge0/postgres-primary

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - srv-kube-worker-1
