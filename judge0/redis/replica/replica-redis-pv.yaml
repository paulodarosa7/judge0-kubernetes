apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-pv-replica

spec:
  capacity:
    storage: 5Gi

  volumeMode: Filesystem

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain

  storageClassName: ""

  local:
    path: /var/lib/judge0/redis-replica

  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - srv-kube-worker-1
