# monitor.yaml
# Monitoramento simples para o Judge0 no Kubernetes:
# kube-state-metrics -> Prometheus -> Grafana
#
# Objetivo: apresentar estado dos pods, workers e reinicializacoes.
# Nao inclui HPA, Alertmanager, exporters extras ou persistencia.
#
# Apos aplicar:
#   kubectl apply -f monitor.yaml
#   kubectl get pods -n monitor
#   kubectl port-forward -n monitor svc/grafana 3000:3000
#
# Grafana:
#   http://127.0.0.1:3000
#   usuario: admin
#   senha: admin
#
# IMPORTANTE: admin/admin e adequado apenas para laboratorio local.

apiVersion: v1
kind: Namespace
metadata:
  name: monitor

---
# ============================================================
# KUBE-STATE-METRICS
# Expoe o estado dos objetos do Kubernetes como metricas.
# ============================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitor

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
    verbs:
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitor

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.17.0
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 150Mi

---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitor
spec:
  selector:
    app: kube-state-metrics
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080

---
# ============================================================
# PROMETHEUS
# Armazena as metricas do kube-state-metrics.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitor
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitor.svc.cluster.local:8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 300m
              memory: 400Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitor
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

---
# ============================================================
# GRAFANA - DATASOURCE
# Prometheus ja entra configurado automaticamente.
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: monitor
data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitor.svc.cluster.local:9090
        isDefault: true
        editable: false

---
# ============================================================
# GRAFANA - PROVISIONAMENTO DA DASHBOARD
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitor
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Judge0
        orgId: 1
        folder: TCC - Judge0
        type: file
        disableDeletion: false
        updateIntervalSeconds: 5
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards

